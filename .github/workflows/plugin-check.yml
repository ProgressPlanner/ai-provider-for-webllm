name: WordPress.org Plugin Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
          # Use a release archive instead of the mutable latest-build URL.
          tools: wp-cli:2.12.0
        env:
          fail-fast: true

      # setup-php stores the ephemeral Actions token in ~/.composer/auth.json
      # as a github-oauth credential. Composer rejects that token whenever it
      # happens to contain a character its validator dislikes ("Your github
      # oauth token for github.com contains invalid characters",
      # composer#12076), so this step fails on roughly half of all runs
      # depending on the token minted for that run.
      #
      # dist-archive-command is a PUBLIC package and needs no auth, so the
      # fix is to delete the stored credential before installing.
      #
      # Pinned to v3.1.0 deliberately: newest release accepting wp-cli ^2.
      # v3.2.x requires ^2.13, which has no stable release (latest is 2.12.0).
      #
      # Without a token Composer sometimes cannot use the GitHub API (the
      # anonymous rate limit is shared by every job on the runner's address)
      # and falls back to cloning over SSH, which fails here with "Permission
      # denied (publickey)". Rewriting SSH remotes to HTTPS lets that fallback
      # clone the public repository anonymously.
      - name: Install dist-archive-command
        run: |
          rm -f "$(composer config --global home 2>/dev/null)/auth.json"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          wp package install wp-cli/dist-archive-command:v3.1.0

      # Build exactly what ships to WordPress.org (honours .distignore).
      - name: Build plugin
        run: |
          wp dist-archive . ./${{ github.event.repository.name }}.zip
          mkdir plugin-check-build
          unzip ${{ github.event.repository.name }}.zip -d plugin-check-build

      - name: Run plugin check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: "./plugin-check-build/${{ github.event.repository.name }}"
